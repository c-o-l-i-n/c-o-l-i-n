name: Update Runner Profile README

on:
  schedule:
    # Runs at 12:00 PM ET (16:00 UTC) daily
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-readme:
    name: Update README with Strava and Sleep Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow matplotlib pandas polyline folium staticmap geopy python-dateutil beautifulsoup4

      - name: Update Strava and Sleep Data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python update_dashboard.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add README.md images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update running stats [skip ci]" && git push)
